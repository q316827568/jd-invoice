name: CI Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install flask flask-cors pymupdf pdf2image Pillow

      - name: Check HTML validity
        run: |
          test -f 报销明细管理.html && echo "✅ HTML 文件存在" || exit 1
          grep -q "报销明细管理" 报销明细管理.html && echo "✅ HTML 内容正确" || exit 1

      - name: Check Python server syntax
        run: |
          python -m py_compile expense-server.py && echo "✅ Python 语法正确" || exit 1
